[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "face-scanner"
version = "0.4.0"
description = "Módulo desacoplado de validação documental e facial para o Totem Hoteleiro/HUB"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.116,<1",
  "uvicorn[standard]>=0.35,<1",
  "python-multipart>=0.0.20,<1",
  "pydantic-settings>=2.6,<3",
  "opencv-python-headless>=4.10,<5.1",
  "numpy>=1.26,<3",
  "Pillow>=10,<13",
  "pytesseract>=0.3.13,<1",
  "rapidfuzz>=3.9,<4",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "httpx>=0.28,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.setuptools.packages.find]
include = ["app*"]
