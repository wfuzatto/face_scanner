services:
  face-scanner:
    # Use junto com docker-compose.yml somente em host com
    # NVIDIA Driver + NVIDIA Container Toolkit.
    # O código atual continua CPU-safe; este override apenas prepara
    # o acesso à GPU para providers acelerados futuros.
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids:
                - "${FACE_SCANNER_GPU_DEVICE:-0}"
              capabilities: [gpu]
    environment:
      NVIDIA_DRIVER_CAPABILITIES: compute,utility,video
      ACCELERATOR_PREFERENCE: cuda
