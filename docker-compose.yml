services:
  face-scanner:
    build: .
    container_name: face-scanner
    restart: unless-stopped
    env_file:
      - .env
    environment:
      APP_ENV: standalone
      SESSION_DB_PATH: /app/data/face_scanner.sqlite3
      # Libera somente /dashboard-api/* para o dashboard de teste.
      # /api/v1/* continua protegido pela API_KEY do .env.
      DASHBOARD_UNAUTHENTICATED: "true"
    volumes:
      - face_scanner_data:/app/data
    # Standalone de teste. Usa 8092 no host porque 8091 pode estar ocupada
    # por outro serviço. No HUB, esta publicação não é usada.
    ports:
      - "${STANDALONE_BIND:-0.0.0.0}:${STANDALONE_PORT:-8092}:8091"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8091/api/v1/health', timeout=4)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    security_opt:
      - no-new-privileges:true

volumes:
  face_scanner_data:
