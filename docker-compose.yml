services:
  face-scanner:
    build: .
    container_name: face-scanner
    restart: unless-stopped
    env_file:
      - .env
    # Standalone: acessível apenas pelo próprio host.
    # No HUB, nem esta porta é publicada; o gateway HTTPS chama a rede Docker.
    ports:
      - "127.0.0.1:8091:8091"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8091/api/v1/health', timeout=4)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    security_opt:
      - no-new-privileges:true
